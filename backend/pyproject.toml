[project]
name = "vacancyscore-backend"
version = "0.1.0"
description = "VacancyScore - AI vacancy analyzer backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pydantic>=2.9",
    "email-validator>=2.2",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "httpx>=0.28",
    "python-multipart>=0.0.12",
    "langchain-core>=0.3",
    "langchain-google-genai>=2.0",
    "pypdf>=5.1",
    "docx2txt>=0.8",
    "reportlab>=4.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.vercel]
entrypoint = "app.main:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
# So `pytest` works the same as `python -m pytest`: both `app` and `tests` are
# importable without installing the project.
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]
